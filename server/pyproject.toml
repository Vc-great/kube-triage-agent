[project]
name = "kube-triage-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aegra-cli==0.10.8",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langgraph-sdk>=0.3,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kube_triage"]
