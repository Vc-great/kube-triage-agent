name: kube-triage-agent
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  redis:
    image: redis:8.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  api:
    build:
      context: ../server
    environment:
      AUTH_TYPE: custom
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:?set DEMO_API_TOKEN}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://k8s-mcp:8080/mcp}
      TRIAGE_ENV: production
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_MODEL: ${LLM_MODEL:?set real LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:?set real LLM_API_KEY}
      CONTEXT_WINDOW_ENABLED: ${CONTEXT_WINDOW_ENABLED:-false}
      CONTEXT_SUMMARY_ENABLED: ${CONTEXT_SUMMARY_ENABLED:-false}
      CONTEXT_ESTIMATED_TOTAL_BUDGET: ${CONTEXT_ESTIMATED_TOTAL_BUDGET:-16384}
      INCIDENT_MEMORY_ENABLED: ${INCIDENT_MEMORY_ENABLED:-false}
      INCIDENT_MEMORY_READ_ENABLED: ${INCIDENT_MEMORY_READ_ENABLED:-false}
      INCIDENT_MEMORY_WRITE_ENABLED: ${INCIDENT_MEMORY_WRITE_ENABLED:-false}
      INCIDENT_MEMORY_PROVENANCE_SECRET: ${INCIDENT_MEMORY_PROVENANCE_SECRET:-}
      INCIDENT_MEMORY_MAX_HITS: ${INCIDENT_MEMORY_MAX_HITS:-2}
      INCIDENT_MEMORY_MAX_CANDIDATES: ${INCIDENT_MEMORY_MAX_CANDIDATES:-20}
      REPAIR_ENABLED: ${REPAIR_ENABLED:-false}
      REPAIR_SIMULATED: ${REPAIR_SIMULATED:-false}
      REPAIR_MCP_SERVER_URL: ${REPAIR_MCP_SERVER_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      SERVER_URL: ${SERVER_URL:-http://localhost:${API_PORT:-12026}}
      AEGRA_CONFIG: /app/aegra.json
      OTEL_TARGETS: ""
      OTEL_CONSOLE_EXPORT: "false"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-12026}:2026"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      k8s-mcp: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2026/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
    networks: [private]

  k8s-mcp:
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.67
    command: ["--config", "/etc/kube-triage/config.toml"]
    volumes:
      - ./k8s-mcp/config.toml:/etc/kube-triage/config.toml:ro
      - type: bind
        source: ../.local/kubeconfig
        target: /run/kube-triage/kubeconfig
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
    networks: [private]

  repair-mcp:
    profiles: ["repair"]
    image: ghcr.io/containers/kubernetes-mcp-server:v0.0.67
    command: ["--config", "/etc/kube-triage/repair-config.toml"]
    volumes:
      - ./k8s-mcp/repair-config.toml:/etc/kube-triage/repair-config.toml:ro
      - type: bind
        source: ../.local/repair-kubeconfig
        target: /run/kube-triage/repair-kubeconfig
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
    networks: [private]

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:12026}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:12026}
      NEXT_PUBLIC_ASSISTANT_ID: agent
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-13000}:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [private]

networks:
  private: {}

volumes:
  postgres_data: {}
  redis_data: {}
