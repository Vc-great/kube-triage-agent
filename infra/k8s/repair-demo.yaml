apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-repair-demo
  namespace: kube-triage-demo
  labels:
    app.kubernetes.io/part-of: kube-triage-agent
    app: triage-repair-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: triage-repair-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: kube-triage-agent
        app: triage-repair-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: busybox:1.36.1
          ports:
            - containerPort: 8080
          command: ["sh", "-c", "mkdir -p /tmp/www && echo ready >/tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
