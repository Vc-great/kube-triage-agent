apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-triage-repairer
  namespace: kube-triage-demo
  labels:
    app.kubernetes.io/part-of: kube-triage-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-triage-repairer
  namespace: kube-triage-demo
  labels:
    app.kubernetes.io/part-of: kube-triage-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["triage-repair-demo"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["triage-repair-demo"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-triage-repairer
  namespace: kube-triage-demo
  labels:
    app.kubernetes.io/part-of: kube-triage-agent
subjects:
  - kind: ServiceAccount
    name: kube-triage-repairer
    namespace: kube-triage-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-triage-repairer
