apiVersion: v1
kind: Pod
metadata:
  name: triage-case-healthy
  namespace: kube-triage-demo
  labels:
    app.kubernetes.io/part-of: kube-triage-agent
    app.kubernetes.io/component: scenario-healthy
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36.1
      command: [sh, -c, 'mkdir -p /tmp/www && echo ready >/tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www']
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet: {path: /, port: 8080}
        initialDelaySeconds: 2
        periodSeconds: 5
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
