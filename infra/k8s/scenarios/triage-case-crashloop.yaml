apiVersion: v1
kind: Pod
metadata:
  name: triage-case-crashloop
  namespace: kube-triage-demo
  labels:
    app.kubernetes.io/part-of: kube-triage-agent
    app.kubernetes.io/component: scenario-crashloop
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - 'if [ -z "${REQUIRED_GREETING:-}" ]; then echo "required configuration REQUIRED_GREETING is missing" >&2; exit 42; fi; exec sleep 3600'
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
