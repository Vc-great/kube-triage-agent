# Use with compose.yaml and .env.dev01.example; dependencies stay on loopback.
services:
  postgres:
    environment:
      POSTGRES_DEV_USER: ${POSTGRES_DEV_USER:?set POSTGRES_DEV_USER}
      POSTGRES_DEV_DB: ${POSTGRES_DEV_DB:?set POSTGRES_DEV_DB}
      POSTGRES_DEV_PASSWORD: ${POSTGRES_DEV_PASSWORD:?set POSTGRES_DEV_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres/init-dev-db.sh:/docker-entrypoint-initdb.d/20-dev-db.sh:ro

  redis-dev:
    image: redis:8.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  k8s-mcp:
    # Linux bind mounts preserve ownership; match the private kubeconfig owner.
    user: "${READER_UID:?set Reader file owner UID}:${READER_GID:?set Reader file owner GID}"
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  redis_dev_data: {}
