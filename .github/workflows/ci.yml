name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
        working-directory: server
      - run: uv run --frozen ruff check src tests ../scripts/check_issue11_manifests.py
        working-directory: server
      - run: uv run --frozen python ../scripts/check_issue11_manifests.py
        working-directory: server
      - run: uv run --frozen pytest -q
        working-directory: server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: node scripts/check-api-keys.mjs
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -p kube-triage-ci-real -f infra/compose.yaml config --quiet
          docker compose -p kube-triage-ci-test -f infra/test.compose.yaml --profile repair-mock config --quiet
          docker compose -p kube-triage-ci-dev01 -f infra/compose.yaml -f infra/dev01.compose.yaml config --quiet
          bash -n scripts/dev01-compose.sh scripts/deploy-dev01.sh infra/postgres/init-dev-db.sh
        env:
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_db
          POSTGRES_PASSWORD: ci-placeholder-only
          DEMO_API_TOKEN: ci-placeholder-only
          LLM_MODEL: ci-placeholder-only
          LLM_API_KEY: ci-placeholder-only
          POSTGRES_DEV_USER: ci_dev
          POSTGRES_DEV_DB: ci_dev
          POSTGRES_DEV_PASSWORD: ci-placeholder-only
          READER_UID: '1000'
          READER_GID: '1000'
