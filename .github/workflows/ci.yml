name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
        working-directory: server
      - run: uv run --frozen ruff check src tests ../scripts/dev.py ../scripts/compose_with_langfuse.py ../scripts/eval_issue12.py ../scripts/prepare_issue12_blind_review.py ../scripts/summarize_issue12_human_review.py ../scripts/eval_phase3a.py ../scripts/obs_lab.py ../scripts/obs_lab_api.py ../scripts/obs_lab_verify.py ../scripts/obs_lab_faults.py ../scripts/check_issue11_manifests.py ../scripts/issue41_b1r_pilot.py ../scripts/issue41_provider_contract.py ../scripts/issue41_p1a_probe.py ../scripts/issue41_b1r_live_pilot.py ../scripts/issue41_p1b_adjudicate.py
        working-directory: server
      - run: uv run --frozen python ../scripts/check_issue11_manifests.py
        working-directory: server
      - run: uv run --frozen pytest -q
        working-directory: server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: node scripts/check-api-keys.mjs
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - run: pnpm exec playwright test tests/conversation-history.spec.ts --output "$RUNNER_TEMP/issue78-web-results"
        working-directory: apps/web
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: issue78
          POSTGRES_PASSWORD: issue78-ci-placeholder
          POSTGRES_DB: issue78
        ports: ['15478:5432']
        options: >-
          --label ao.session=issue78-ci-${{ github.run_id }}
          --health-cmd "pg_isready -U issue78 -d issue78"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://issue78:issue78-ci-placeholder@127.0.0.1:15478/issue78
      ISSUE78_TEST_DATABASE_URL: postgresql://issue78:issue78-ci-placeholder@127.0.0.1:15478/issue78
      ISSUE78_TEST_API_URL: http://127.0.0.1:12079
      DEMO_API_TOKEN: issue78-ci-placeholder
      TRIAGE_ENV: test
      AUTH_TYPE: custom
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
      MOCK_MCP_HOST: 127.0.0.1
      APP_HISTORY_ENABLED: 'true'
      APP_EVIDENCE_ENABLED: 'true'
      OTEL_TARGETS: ''
      OTEL_CONSOLE_EXPORT: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
        working-directory: server
      - name: FakeModel / Mock MCP / PostgreSQL protocol integration
        working-directory: server
        run: |
          set -euo pipefail
          uv run --frozen python -m kube_triage.app_storage
          TRIAGE_MOCK_DATASET=memory-web setsid .venv/bin/python -m kube_triage.mock_mcp > "$RUNNER_TEMP/issue78-mock.log" 2>&1 &
          mock_pid=$!
          api_log="$RUNNER_TEMP/issue78-api.log"
          setsid .venv/bin/aegra serve --config aegra.issue78-demo.json --host 127.0.0.1 --port 12079 > "$api_log" 2>&1 &
          api_pid=$!
          trap 'if [ "$?" -ne 0 ]; then tail -n 60 "$api_log"; fi; kill -- -"$api_pid" 2>/dev/null || true; kill -- -"$mock_pid" 2>/dev/null || true' EXIT
          uv run --frozen python - <<'PY'
          import time
          import httpx
          for _ in range(120):
              try:
                  if httpx.get("http://127.0.0.1:12079/health", timeout=1).status_code == 200:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(.25)
          else:
              raise SystemExit("isolated Aegra did not start")
          PY
          uv run --frozen pytest -q tests/test_app_persistence.py tests/test_app_protocol.py tests/test_phase3_persistence.py tests/test_phase3_agent_pg.py
          stop_api() {
            kill -- -"$api_pid" 2>/dev/null || true
            wait "$api_pid" || true
            uv run --frozen python - <<'PYSTOP'
          import socket
          import time
          for _ in range(100):
              try:
                  with socket.create_connection(("127.0.0.1", 12079), timeout=.2):
                      pass
              except OSError:
                  break
              time.sleep(.1)
          else:
              raise SystemExit("previous isolated Aegra still owns port 12079")
          PYSTOP
          }
          stop_api
          for profile in b1 skills; do
            config="aegra.phase-b1.json"
            if [ "$profile" = skills ]; then config="aegra.phase-skills.json"; fi
            api_log="$RUNNER_TEMP/issue78-$profile.log"
            DEEP_DIAGNOSIS_FAKE_MODEL=true TRIAGE_MOCK_DATASET=memory-web \
              setsid .venv/bin/aegra serve --config "$config" --host 127.0.0.1 --port 12079 > "$api_log" 2>&1 &
            api_pid=$!
            ISSUE78_PHASE3_PROFILE="$profile" uv run --frozen python - <<'PYWAIT'
          import os
          import time
          import httpx
          expected = ({"deep_diagnosis_skills"} if os.environ["ISSUE78_PHASE3_PROFILE"] == "skills"
                      else {"deep_diagnosis", "deep_diagnosis_planning"})
          observed, last_status = set(), None
          for _ in range(120):
              try:
                  response = httpx.get("http://127.0.0.1:12079/assistants", timeout=1,
                                      headers={"x-api-key": os.environ["DEMO_API_TOKEN"]})
                  last_status = response.status_code
                  # Assistants from earlier profiles remain in the shared PG.
                  if last_status == 200:
                      observed = {a["graph_id"] for a in response.json()["assistants"]}
                      if expected <= observed:
                          break
              except httpx.HTTPError:
                  pass
              time.sleep(.25)
          else:
              print("profile readiness:", "status=", last_status,
                    "expected=", sorted(expected), "observed=", sorted(observed))
              raise SystemExit("isolated experiment Aegra profile did not become ready")
          PYWAIT
            ISSUE78_PHASE3_PROFILE="$profile" uv run --frozen pytest -q tests/test_phase3_protocol.py
            stop_api
          done
  skills:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: skills
          POSTGRES_PASSWORD: skills-demo-local-only
          POSTGRES_DB: skills
        ports: ['15475:5432']
        options: >-
          --label ao.session=issue75-ci-${{ github.run_id }}
          --health-cmd "pg_isready -U skills -d skills"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '15475'
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills-demo-local-only
      POSTGRES_DB: skills
      ISSUE75_TEST_API_URL: http://127.0.0.1:12075
      SERVER_URL: http://127.0.0.1:12075
      DEMO_API_TOKEN: skills-demo-local-only
      TRIAGE_ENV: test
      TRIAGE_MOCK_DATASET: memory-web
      AUTH_TYPE: custom
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
      MOCK_MCP_HOST: 127.0.0.1
      DEEP_DIAGNOSIS_FAKE_MODEL: 'true'
      REDIS_BROKER_ENABLED: 'false'
      APP_HISTORY_ENABLED: 'false'
      APP_EVIDENCE_ENABLED: 'false'
      OTEL_TARGETS: ''
      OTEL_SDK_DISABLED: 'true'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
        working-directory: server
      - name: Native Skills / FakeModel / Mock MCP / Aegra SSE
        working-directory: server
        run: |
          set -euo pipefail
          uv run --frozen ruff check src tests ../scripts/skills_demo.py
          uv run --frozen python -m kube_triage.mock_mcp > "$RUNNER_TEMP/issue75-mock.log" 2>&1 &
          mock_pid=$!
          uv run --frozen aegra serve --config aegra.phase-skills.json --host 127.0.0.1 --port 12075 > "$RUNNER_TEMP/issue75-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$mock_pid" 2>/dev/null || true' EXIT
          uv run --frozen python - <<'PY'
          import time
          import httpx
          for _ in range(120):
              try:
                  if httpx.get("http://127.0.0.1:12075/health", timeout=1).status_code == 200:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(.25)
          else:
              raise SystemExit("Skills Aegra did not start")
          PY
          uv run --frozen pytest -q tests/test_deep_diagnosis_skills.py tests/test_skills_protocol.py
  reviewer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: skills
          POSTGRES_PASSWORD: skills-demo-local-only
          POSTGRES_DB: skills
        ports: ['15472:5432']
        options: >-
          --label ao.session=issue72-ci-${{ github.run_id }}
          --health-cmd "pg_isready -U skills -d skills"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '15472'
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills-demo-local-only
      POSTGRES_DB: skills
      ISSUE72_TEST_API_URL: http://127.0.0.1:12072
      SERVER_URL: http://127.0.0.1:12072
      DEMO_API_TOKEN: skills-demo-local-only
      TRIAGE_ENV: test
      TRIAGE_MOCK_DATASET: review-web
      AUTH_TYPE: custom
      MCP_SERVER_URL: http://127.0.0.1:8000/mcp
      MOCK_MCP_HOST: 127.0.0.1
      DEEP_DIAGNOSIS_FAKE_MODEL: 'true'
      REDIS_BROKER_ENABLED: 'false'
      APP_HISTORY_ENABLED: 'false'
      APP_EVIDENCE_ENABLED: 'false'
      OTEL_TARGETS: ''
      OTEL_SDK_DISABLED: 'true'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
        working-directory: server
      - name: Native Reviewer / FakeModel / Mock MCP / Aegra SSE
        working-directory: server
        run: |
          set -euo pipefail
          uv run --frozen ruff check src tests ../scripts/skills_demo.py ../scripts/review_demo.py
          uv run --frozen python -m kube_triage.mock_mcp > "$RUNNER_TEMP/issue72-mock.log" 2>&1 &
          mock_pid=$!
          uv run --frozen aegra serve --config aegra.phase-review.json --host 127.0.0.1 --port 12072 > "$RUNNER_TEMP/issue72-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$mock_pid" 2>/dev/null || true' EXIT
          uv run --frozen python - <<'PY'
          import time
          import httpx
          for _ in range(120):
              try:
                  if httpx.get("http://127.0.0.1:12072/health", timeout=1).status_code == 200:
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(.25)
          else:
              raise SystemExit("Reviewer Aegra did not start")
          PY
          uv run --frozen pytest -q -s tests/test_review_protocol.py
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -p kube-triage-ci-real -f infra/compose.yaml config --quiet
          docker compose -p kube-triage-ci-test -f infra/test.compose.yaml --profile repair-mock config --quiet
          EVAL_PROMPT_VARIANT=A TRIAGE_MOCK_DATASET=issue12-blind-v1 API_PORT=12128 WEB_PORT=13128 docker compose -p kube-triage-issue12-a -f infra/test.compose.yaml config --quiet
          EVAL_PROMPT_VARIANT=B TRIAGE_MOCK_DATASET=issue12-blind-v1 API_PORT=12129 WEB_PORT=13129 docker compose -p kube-triage-issue12-b -f infra/test.compose.yaml config --quiet
          docker compose -p kube-triage-ci-dev01 -f infra/compose.yaml -f infra/dev01.compose.yaml config --quiet
          docker compose -p kube-triage-ci-dev01-langfuse -f infra/compose.yaml -f infra/dev01.compose.yaml -f infra/langfuse.compose.yaml config --quiet
          docker compose -p kube-triage-ci-test-langfuse -f infra/test.compose.yaml -f infra/langfuse.compose.yaml config --quiet
          docker compose -p kube-triage-ci-real -f infra/compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; a=s["api"]; e=a["environment"]; assert e["OTEL_TARGETS"] == ""; assert not any(k.startswith("LANGFUSE_") for k in e); assert e["HTTP_PROXY"] == e["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert "host.docker.internal=host-gateway" in a["extra_hosts"]; assert all("HTTPS_PROXY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-test -f infra/test.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; a=s["api"]; e=a["environment"]; assert e["OTEL_TARGETS"] == ""; assert not any(k.startswith("LANGFUSE_") for k in e); assert e["HTTP_PROXY"] == e["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert "host.docker.internal=host-gateway" in a["extra_hosts"]; assert all("HTTP_PROXY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-dev01-langfuse -f infra/compose.yaml -f infra/dev01.compose.yaml -f infra/langfuse.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; e=s["api"]["environment"]; assert e["OTEL_TARGETS"] == "LANGFUSE"; assert all(k in e for k in ("LANGFUSE_SECRET_KEY", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_BASE_URL")); assert all(not any(k.startswith("LANGFUSE_") for k in v.get("environment", {})) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-dev01-langfuse -f infra/compose.yaml -f infra/dev01.compose.yaml -f infra/langfuse.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; a=s["api"]; assert a["environment"]["HTTP_PROXY"] == a["environment"]["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert "host.docker.internal=host-gateway" in a["extra_hosts"]; assert all("HTTPS_PROXY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-test-langfuse -f infra/test.compose.yaml -f infra/langfuse.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; e=s["api"]["environment"]; assert e["TRIAGE_ENV"] == "test" and e["OTEL_TARGETS"] == "LANGFUSE"; assert all(k in e for k in ("LANGFUSE_SECRET_KEY", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_BASE_URL")); assert all(not any(k.startswith("LANGFUSE_") for k in v.get("environment", {})) for n,v in s.items() if n != "api")'
          python3 -c 'from pathlib import Path; p=Path(".env"); p.write_text("# CI fixture without Langfuse keys\n"); p.chmod(0o600)'
          python3 scripts/compose_with_langfuse.py formal kube-triage-ci-no-keys config --format json | python3 -c 'import json,sys; e=json.load(sys.stdin)["services"]["api"]["environment"]; assert e["OTEL_TARGETS"] == "" and "LANGFUSE_SECRET_KEY" not in e'
          python3 -c 'from pathlib import Path; p=Path(".env"); p.write_text("LANGFUSE_SECRET_KEY=ci-file-placeholder-only\nLANGFUSE_PUBLIC_KEY=ci-file-placeholder-only\nLANGFUSE_BASE_URL=https://jp.cloud.langfuse.com\n")'
          python3 scripts/compose_with_langfuse.py dev01 kube-triage-ci-auto-langfuse config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; e=s["api"]["environment"]; assert e["OTEL_TARGETS"] == "LANGFUSE" and e["LANGFUSE_SECRET_KEY"] == "ci-file-placeholder-only"; assert e["HTTP_PROXY"] == e["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert all("LANGFUSE_SECRET_KEY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          bash -n scripts/compose.sh scripts/dev01-compose.sh scripts/deploy-dev01.sh infra/postgres/init-dev-db.sh
        env:
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_db
          POSTGRES_PASSWORD: ci-placeholder-only
          DEMO_API_TOKEN: ci-placeholder-only
          LLM_MODEL: ci-placeholder-only
          LLM_API_KEY: ci-placeholder-only
          POSTGRES_DEV_USER: ci_dev
          POSTGRES_DEV_DB: ci_dev
          POSTGRES_DEV_PASSWORD: ci-placeholder-only
          READER_UID: '1000'
          READER_GID: '1000'
          LANGFUSE_SECRET_KEY: ci-placeholder-only
          LANGFUSE_PUBLIC_KEY: ci-placeholder-only
