name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.13
        working-directory: server
      - run: uv run --frozen ruff check src tests ../scripts/dev.py ../scripts/compose_with_langfuse.py ../scripts/eval_issue12.py ../scripts/prepare_issue12_blind_review.py ../scripts/summarize_issue12_human_review.py ../scripts/eval_phase3a.py ../scripts/check_issue11_manifests.py ../scripts/issue41_b1r_pilot.py ../scripts/issue41_provider_contract.py ../scripts/issue41_p1a_probe.py ../scripts/issue41_b1r_live_pilot.py ../scripts/issue41_p1b_adjudicate.py
        working-directory: server
      - run: uv run --frozen python ../scripts/check_issue11_manifests.py
        working-directory: server
      - run: uv run --frozen pytest -q
        working-directory: server
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: node scripts/check-api-keys.mjs
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -p kube-triage-ci-real -f infra/compose.yaml config --quiet
          docker compose -p kube-triage-ci-test -f infra/test.compose.yaml --profile repair-mock config --quiet
          EVAL_PROMPT_VARIANT=A TRIAGE_MOCK_DATASET=issue12-blind-v1 API_PORT=12128 WEB_PORT=13128 docker compose -p kube-triage-issue12-a -f infra/test.compose.yaml config --quiet
          EVAL_PROMPT_VARIANT=B TRIAGE_MOCK_DATASET=issue12-blind-v1 API_PORT=12129 WEB_PORT=13129 docker compose -p kube-triage-issue12-b -f infra/test.compose.yaml config --quiet
          docker compose -p kube-triage-ci-dev01 -f infra/compose.yaml -f infra/dev01.compose.yaml config --quiet
          docker compose -p kube-triage-ci-dev01-langfuse -f infra/compose.yaml -f infra/dev01.compose.yaml -f infra/langfuse.compose.yaml config --quiet
          docker compose -p kube-triage-ci-test-langfuse -f infra/test.compose.yaml -f infra/langfuse.compose.yaml config --quiet
          docker compose -p kube-triage-ci-real -f infra/compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; a=s["api"]; e=a["environment"]; assert e["OTEL_TARGETS"] == ""; assert not any(k.startswith("LANGFUSE_") for k in e); assert e["HTTP_PROXY"] == e["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert "host.docker.internal=host-gateway" in a["extra_hosts"]; assert all("HTTPS_PROXY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-test -f infra/test.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; a=s["api"]; e=a["environment"]; assert e["OTEL_TARGETS"] == ""; assert not any(k.startswith("LANGFUSE_") for k in e); assert e["HTTP_PROXY"] == e["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert "host.docker.internal=host-gateway" in a["extra_hosts"]; assert all("HTTP_PROXY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-dev01-langfuse -f infra/compose.yaml -f infra/dev01.compose.yaml -f infra/langfuse.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; e=s["api"]["environment"]; assert e["OTEL_TARGETS"] == "LANGFUSE"; assert all(k in e for k in ("LANGFUSE_SECRET_KEY", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_BASE_URL")); assert all(not any(k.startswith("LANGFUSE_") for k in v.get("environment", {})) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-dev01-langfuse -f infra/compose.yaml -f infra/dev01.compose.yaml -f infra/langfuse.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; a=s["api"]; assert a["environment"]["HTTP_PROXY"] == a["environment"]["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert "host.docker.internal=host-gateway" in a["extra_hosts"]; assert all("HTTPS_PROXY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          docker compose -p kube-triage-ci-test-langfuse -f infra/test.compose.yaml -f infra/langfuse.compose.yaml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; e=s["api"]["environment"]; assert e["TRIAGE_ENV"] == "test" and e["OTEL_TARGETS"] == "LANGFUSE"; assert all(k in e for k in ("LANGFUSE_SECRET_KEY", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_BASE_URL")); assert all(not any(k.startswith("LANGFUSE_") for k in v.get("environment", {})) for n,v in s.items() if n != "api")'
          python3 -c 'from pathlib import Path; p=Path(".env"); p.write_text("# CI fixture without Langfuse keys\n"); p.chmod(0o600)'
          python3 scripts/compose_with_langfuse.py formal kube-triage-ci-no-keys config --format json | python3 -c 'import json,sys; e=json.load(sys.stdin)["services"]["api"]["environment"]; assert e["OTEL_TARGETS"] == "" and "LANGFUSE_SECRET_KEY" not in e'
          python3 -c 'from pathlib import Path; p=Path(".env"); p.write_text("LANGFUSE_SECRET_KEY=ci-file-placeholder-only\nLANGFUSE_PUBLIC_KEY=ci-file-placeholder-only\nLANGFUSE_BASE_URL=https://jp.cloud.langfuse.com\n")'
          python3 scripts/compose_with_langfuse.py dev01 kube-triage-ci-auto-langfuse config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; e=s["api"]["environment"]; assert e["OTEL_TARGETS"] == "LANGFUSE" and e["LANGFUSE_SECRET_KEY"] == "ci-file-placeholder-only"; assert e["HTTP_PROXY"] == e["HTTPS_PROXY"] == "http://host.docker.internal:7890"; assert all("LANGFUSE_SECRET_KEY" not in v.get("environment", {}) for n,v in s.items() if n != "api")'
          bash -n scripts/compose.sh scripts/dev01-compose.sh scripts/deploy-dev01.sh infra/postgres/init-dev-db.sh
        env:
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_db
          POSTGRES_PASSWORD: ci-placeholder-only
          DEMO_API_TOKEN: ci-placeholder-only
          LLM_MODEL: ci-placeholder-only
          LLM_API_KEY: ci-placeholder-only
          POSTGRES_DEV_USER: ci_dev
          POSTGRES_DEV_DB: ci_dev
          POSTGRES_DEV_PASSWORD: ci-placeholder-only
          READER_UID: '1000'
          READER_GID: '1000'
          LANGFUSE_SECRET_KEY: ci-placeholder-only
          LANGFUSE_PUBLIC_KEY: ci-placeholder-only
